<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎来到我的主页</title>
  <style>
    :root {
      --bg: #02040a;
      --ink: #f8fbff;
      --muted: rgba(248, 251, 255, 0.68);
      --cyan: #66f2ff;
      --green: #7cffb2;
      --pink: #ff5d9a;
      --violet: #9b7cff;
      --line: rgba(248, 251, 255, 0.16);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", "Courier New", monospace;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(102, 242, 255, 0.18), transparent 32%),
        radial-gradient(circle at 82% 72%, rgba(255, 93, 154, 0.16), transparent 34%),
        #02040a;
    }

    button {
      font: inherit;
    }

    #fluidCanvas,
    #gridCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #fluidCanvas {
      z-index: 0;
    }

    #gridCanvas {
      z-index: 1;
      opacity: 0;
      transition: opacity 900ms ease;
    }

    body.entered #gridCanvas {
      opacity: 0.52;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 34px 34px;
      -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.25));
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.25));
    }

    .scanline {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.035) 0,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 1px,
        transparent 6px
      );
      mix-blend-mode: screen;
      opacity: 0.38;
    }

    .app {
      position: relative;
      z-index: 4;
      min-height: 100vh;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 40px 24px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(28px) scale(0.985);
      transition: opacity 760ms ease, transform 760ms ease, filter 760ms ease;
      filter: blur(8px);
    }

    .screen.is-active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .screen::after {
      position: absolute;
      inset: 22px;
      z-index: -1;
      content: "";
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow:
        inset 0 0 90px rgba(255, 255, 255, 0.05),
        0 0 60px rgba(102, 242, 255, 0.06);
      pointer-events: none;
    }

    .intro-copy,
    .card {
      text-align: center;
    }

    .terminal-mark {
      display: inline-grid;
      width: 72px;
      height: 72px;
      margin-bottom: 26px;
      place-items: center;
      border: 1px solid rgba(124, 255, 178, 0.46);
      border-radius: 24px;
      color: var(--green);
      background: rgba(5, 11, 20, 0.58);
      box-shadow:
        0 0 36px rgba(124, 255, 178, 0.18),
        inset 0 0 22px rgba(124, 255, 178, 0.08);
      font-family: var(--mono);
      font-size: 30px;
      font-weight: 800;
    }

    .kicker {
      margin: 0 0 18px;
      color: var(--cyan);
      font-family: var(--mono);
      font-size: clamp(12px, 1.8vw, 15px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 960px;
      margin-bottom: 18px;
      font-size: clamp(48px, 9vw, 112px);
      font-weight: 850;
      line-height: 0.98;
      letter-spacing: 0;
      text-shadow:
        0 0 30px rgba(102, 242, 255, 0.16),
        0 24px 70px rgba(0, 0, 0, 0.55);
    }

    .subtitle {
      margin-bottom: 36px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: clamp(17px, 2.2vw, 24px);
      line-height: 1.8;
    }

    .enter {
      position: relative;
      min-width: 188px;
      min-height: 48px;
      border: 1px solid rgba(248, 251, 255, 0.44);
      border-radius: 999px;
      color: var(--ink);
      cursor: pointer;
      background: rgba(248, 251, 255, 0.06);
      box-shadow:
        0 0 28px rgba(102, 242, 255, 0.14),
        inset 0 0 18px rgba(255, 255, 255, 0.05);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.14em;
      overflow: hidden;
      transition: border-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .enter::before {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(102, 242, 255, 0.34), transparent);
      transform: translateX(-110%);
      transition: transform 420ms ease;
    }

    .enter:hover,
    .enter:focus-visible {
      border-color: var(--cyan);
      color: var(--cyan);
      outline: none;
      transform: translateY(-2px);
    }

    .enter:hover::before,
    .enter:focus-visible::before {
      transform: translateX(110%);
    }

    .scroll-tip {
      position: absolute;
      bottom: 48px;
      left: 50%;
      display: grid;
      gap: 10px;
      justify-items: center;
      color: rgba(248, 251, 255, 0.58);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    .scroll-tip span {
      width: 1px;
      height: 42px;
      background: linear-gradient(180deg, transparent, var(--cyan), transparent);
      animation: scrollPulse 1.8s ease-in-out infinite;
    }

    .card {
      width: min(100%, 520px);
      border: 1px solid rgba(248, 251, 255, 0.18);
      border-radius: 26px;
      padding: clamp(32px, 6vw, 56px);
      background:
        linear-gradient(180deg, rgba(8, 16, 30, 0.74), rgba(4, 8, 15, 0.56)),
        rgba(8, 16, 30, 0.54);
      box-shadow:
        0 34px 90px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px);
    }

    .avatar {
      position: relative;
      display: grid;
      width: 116px;
      height: 116px;
      margin: 0 auto 26px;
      place-items: center;
      border: 1px solid rgba(248, 251, 255, 0.2);
      border-radius: 50%;
      color: #051019;
      background:
        radial-gradient(circle at 36% 28%, #ffffff, transparent 24%),
        conic-gradient(from 210deg, var(--cyan), var(--green), var(--pink), var(--violet), var(--cyan));
      box-shadow:
        0 0 44px rgba(102, 242, 255, 0.26),
        0 18px 54px rgba(0, 0, 0, 0.32);
      font-size: 36px;
      font-weight: 900;
    }

    .avatar::before,
    .avatar::after {
      position: absolute;
      inset: -10px;
      content: "";
      border: 1px solid rgba(102, 242, 255, 0.28);
      border-radius: inherit;
      animation: orbit 7s linear infinite;
    }

    .avatar::after {
      inset: -18px;
      border-color: rgba(255, 93, 154, 0.22);
      animation-duration: 11s;
      animation-direction: reverse;
    }

    h2 {
      margin-bottom: 10px;
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 820;
      letter-spacing: 0;
      line-height: 1.1;
    }

    .signature {
      margin-bottom: 30px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.7;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .links button {
      display: grid;
      width: 100%;
      min-height: 74px;
      place-items: center;
      border: 1px solid rgba(248, 251, 255, 0.14);
      border-radius: 18px;
      color: rgba(248, 251, 255, 0.84);
      cursor: pointer;
      background: rgba(248, 251, 255, 0.045);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 760;
      transition: border-color 180ms ease, color 180ms ease, transform 180ms ease, background 180ms ease;
    }

    .links button:hover,
    .links button:focus-visible {
      border-color: rgba(102, 242, 255, 0.62);
      color: var(--cyan);
      outline: none;
      background: rgba(102, 242, 255, 0.08);
      transform: translateY(-4px);
    }

    .back {
      margin-top: 24px;
      border: 0;
      color: rgba(248, 251, 255, 0.54);
      cursor: pointer;
      background: transparent;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 180ms ease;
    }

    .back:hover,
    .back:focus-visible {
      color: var(--green);
      outline: none;
    }

    .wipe {
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 54%, rgba(124, 255, 178, 0.26), transparent 28%),
        linear-gradient(135deg, rgba(102, 242, 255, 0.96), rgba(155, 124, 255, 0.94) 48%, rgba(255, 93, 154, 0.92));
      clip-path: ellipse(120% 72% at 50% 100%);
      transform: translateY(104%);
    }

    body.is-switching .wipe {
      animation: wipeScreen 960ms cubic-bezier(0.78, 0, 0.22, 1) both;
    }

    .intro-copy > *,
    .card > * {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 650ms ease, transform 650ms ease;
    }

    .screen.is-active .intro-copy > *,
    .screen.is-active .card > * {
      opacity: 1;
      transform: translateY(0);
    }

    .screen.is-active .intro-copy > :nth-child(2),
    .screen.is-active .card > :nth-child(2) {
      transition-delay: 90ms;
    }

    .screen.is-active .intro-copy > :nth-child(3),
    .screen.is-active .card > :nth-child(3) {
      transition-delay: 170ms;
    }

    .screen.is-active .intro-copy > :nth-child(4),
    .screen.is-active .card > :nth-child(4) {
      transition-delay: 250ms;
    }

    @keyframes wipeScreen {
      0% {
        clip-path: ellipse(120% 72% at 50% 100%);
        transform: translateY(104%);
      }

      46% {
        clip-path: ellipse(150% 112% at 50% 50%);
        transform: translateY(0);
      }

      100% {
        clip-path: ellipse(120% 72% at 50% 0%);
        transform: translateY(-104%);
      }
    }

    @keyframes scrollPulse {
      0%,
      100% {
        opacity: 0.32;
        transform: scaleY(0.72);
      }

      50% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    @keyframes orbit {
      from {
        transform: rotate(0deg) scale(1);
      }

      50% {
        transform: rotate(180deg) scale(1.04);
      }

      to {
        transform: rotate(360deg) scale(1);
      }
    }

    @media (max-width: 640px) {
      .screen {
        padding: 30px 18px;
      }

      .screen::after {
        inset: 14px;
        border-radius: 20px;
      }

      .terminal-mark {
        width: 64px;
        height: 64px;
        border-radius: 20px;
      }

      .links {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .scroll-tip {
        bottom: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="fluidCanvas" aria-hidden="true"></canvas>
  <canvas id="gridCanvas" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>
  <div class="wipe" aria-hidden="true"></div>

  <main class="app">
    <section class="screen intro is-active" aria-label="启动页">
      <div class="intro-copy">
        <div class="terminal-mark" aria-hidden="true">&gt;_</div>
        <p class="kicker">HELLO / PERSONAL SPACE</p>
        <h1>欢迎来到我的主页</h1>
        <p class="subtitle">Think &gt;&gt; Create &gt;&gt; Share</p>
        <button class="enter" type="button">PRESS START</button>
      </div>
      <div class="scroll-tip" aria-hidden="true">
        <span></span>
        Scroll
      </div>
    </section>

    <section class="screen home" aria-label="主页">
      <div class="card">
        <div class="avatar" aria-hidden="true">我</div>
        <h2>我的主页</h2>
        <p class="signature">INPUT | 思考 &gt;&gt; 输出 /dev/home</p>
        <ul class="links" aria-label="主页导航">
          <li><button type="button">Blog</button></li>
          <li><button type="button">Thoughts</button></li>
          <li><button type="button">About</button></li>
          <li><button type="button">Projects</button></li>
        </ul>
        <button class="back" type="button">Back to start</button>
      </div>
    </section>
  </main>

  <script>
    const fluidCanvas = document.querySelector("#fluidCanvas");
    const gridCanvas = document.querySelector("#gridCanvas");
    const introScreen = document.querySelector(".intro");
    const homeScreen = document.querySelector(".home");
    const enterButton = document.querySelector(".enter");
    const backButton = document.querySelector(".back");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let activeScreen = "intro";
    let locked = false;

    function setCanvasSize(canvas) {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * pixelRatio);
      canvas.height = Math.floor(window.innerHeight * pixelRatio);
      canvas.getContext("2d").setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function resizeCanvases() {
      setCanvasSize(fluidCanvas);
      setCanvasSize(gridCanvas);
    }

    resizeCanvases();
    window.addEventListener("resize", resizeCanvases);

    function switchTo(target) {
      if (locked || activeScreen === target) {
        return;
      }

      locked = true;
      document.body.classList.add("is-switching");

      window.setTimeout(() => {
        activeScreen = target;
        introScreen.classList.toggle("is-active", target === "intro");
        homeScreen.classList.toggle("is-active", target === "home");
        document.body.classList.toggle("entered", target === "home");
      }, 430);

      window.setTimeout(() => {
        document.body.classList.remove("is-switching");
        locked = false;
      }, 980);
    }

    enterButton.addEventListener("click", () => switchTo("home"));
    backButton.addEventListener("click", () => switchTo("intro"));

    window.addEventListener("wheel", (event) => {
      if (Math.abs(event.deltaY) < 24) {
        return;
      }

      event.preventDefault();
      switchTo(event.deltaY > 0 ? "home" : "intro");
    }, { passive: false });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === "ArrowDown" || event.key === "PageDown") {
        switchTo("home");
      }

      if (event.key === "ArrowUp" || event.key === "PageUp" || event.key === "Escape") {
        switchTo("intro");
      }
    });

    let touchStartY = 0;

    window.addEventListener("touchstart", (event) => {
      touchStartY = event.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("touchend", (event) => {
      const touchEndY = event.changedTouches[0].clientY;
      const distance = touchStartY - touchEndY;

      if (Math.abs(distance) > 42) {
        switchTo(distance > 0 ? "home" : "intro");
      }
    }, { passive: true });

    const fluidContext = fluidCanvas.getContext("2d");
    const pointer = {
      x: window.innerWidth * 0.5,
      y: window.innerHeight * 0.5,
      active: false
    };

    const blobs = Array.from({ length: prefersReducedMotion ? 10 : 24 }, (_, index) => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: 90 + Math.random() * 180,
      vx: (Math.random() - 0.5) * 0.34,
      vy: (Math.random() - 0.5) * 0.34,
      hue: [188, 145, 332, 132][index % 4],
      alpha: 0.09 + Math.random() * 0.08
    }));

    window.addEventListener("pointermove", (event) => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      pointer.active = true;
    });

    window.addEventListener("pointerleave", () => {
      pointer.active = false;
    });

    function drawGlow(context, x, y, radius, color) {
      const gradient = context.createRadialGradient(x, y, 0, x, y, radius);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
      context.fillStyle = gradient;
      context.beginPath();
      context.arc(x, y, radius, 0, Math.PI * 2);
      context.fill();
    }

    function animateFluid() {
      fluidContext.globalCompositeOperation = "source-over";
      fluidContext.fillStyle = "rgba(2, 4, 10, 0.18)";
      fluidContext.fillRect(0, 0, window.innerWidth, window.innerHeight);
      fluidContext.globalCompositeOperation = "lighter";

      blobs.forEach((blob) => {
        blob.x += blob.vx;
        blob.y += blob.vy;

        if (blob.x < -blob.radius) {
          blob.x = window.innerWidth + blob.radius;
        }

        if (blob.x > window.innerWidth + blob.radius) {
          blob.x = -blob.radius;
        }

        if (blob.y < -blob.radius) {
          blob.y = window.innerHeight + blob.radius;
        }

        if (blob.y > window.innerHeight + blob.radius) {
          blob.y = -blob.radius;
        }

        drawGlow(fluidContext, blob.x, blob.y, blob.radius, `hsla(${blob.hue}, 96%, 64%, ${blob.alpha})`);
      });

      if (pointer.active) {
        drawGlow(fluidContext, pointer.x, pointer.y, 190, "rgba(102, 242, 255, 0.14)");
      }

      requestAnimationFrame(animateFluid);
    }

    const gridContext = gridCanvas.getContext("2d");

    function animateGrid(timestamp) {
      gridContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      gridContext.lineWidth = 1;

      const size = window.innerWidth < 640 ? 34 : 42;
      const offset = (timestamp * 0.025) % size;
      const glow = 0.45 + Math.sin(timestamp * 0.0018) * 0.25;

      gridContext.strokeStyle = "rgba(248, 251, 255, 0.08)";
      gridContext.beginPath();

      for (let x = -size + offset; x < window.innerWidth + size; x += size) {
        gridContext.moveTo(x, 0);
        gridContext.lineTo(x + window.innerHeight * 0.32, window.innerHeight);
      }

      for (let y = -size + offset; y < window.innerHeight + size; y += size) {
        gridContext.moveTo(0, y);
        gridContext.lineTo(window.innerWidth, y + window.innerWidth * 0.32);
      }

      gridContext.stroke();
      gridContext.fillStyle = `rgba(124, 255, 178, ${0.08 + glow * 0.1})`;

      for (let i = 0; i < 18; i += 1) {
        const x = (i * 137 + timestamp * 0.025) % (window.innerWidth + size) - size;
        const y = (i * 89 + timestamp * 0.018) % (window.innerHeight + size) - size;
        gridContext.fillRect(x, y, 8, 8);
      }

      requestAnimationFrame(animateGrid);
    }

    animateFluid();
    animateGrid(0);
  </script>
</body>
</html>
