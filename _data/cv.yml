          - 设计 POBC 与 POBC-SIV 2 套候选方案，对比 AES-CTR-PMAC、AES-GCM、AES-GCM-SIV、Eevee 系列方案。
          - 从效率、并行能力、安全特性等维度形成可汇报的技术方案材料。

